<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수자원개발기술사 학습</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=202611190813">
</head>
<body>
<header class="top">
  <div class="brand"><b>수자원개발기술사 학습</b><select id="topicSel" aria-label="주제"></select><span id="topicLine"></span></div>
  <details class="menu" id="recMenu"><summary>기록 관리</summary>
    <div class="pop"><p>공부 기록은 이 기기에만 저장됩니다. 아이폰·아이패드를 오갈 때 씁니다.</p>
      <label class="chk"><input type="checkbox" id="withPen" checked> 손글씨 포함 <span id="penSize"></span></label>
      <button class="ghost" id="exportBtn" type="button">기록 내보내기</button>
      <button class="ghost" id="importBtn" type="button">불러와 합치기(권장)</button>
      <button class="ghost" id="replaceBtn" type="button">불러와 통째로 바꾸기</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden></div>
  </details>
</header>

<div class="shell">
  <nav class="steps" aria-label="학습 단계">
    <button class="step" data-step="today"><i>0</i>오늘 할 일</button>
    <button class="step" data-step="read"><i>1</i>서브노트 읽기</button>
    <button class="step" data-step="recall"><i>2</i>가리고 떠올리기</button>
    <button class="step" data-step="write"><i>3</i>시간 재고 쓰기</button>
    <button class="step" data-step="compare"><i>4</i>모범답안과 비교</button>
    <button class="step" data-step="review"><i>5</i>복습 예약</button>
    <hr>
    <button class="step" data-step="list"><i>≡</i>문항 목록</button>
    <button class="step" data-step="due"><i>↻</i>복습 모아 보기<span class="cnt" id="dueCnt"></span></button>
    <button class="step" data-step="cards"><i>▤</i>요약 카드</button>
    <button class="step" data-step="skel"><i>✎</i>뼈대 잡기</button>
    <button class="step" data-step="mock"><i>◷</i>모의고사</button>
    <button class="step" data-step="plan"><i>▣</i>주간 계획</button>
    <button class="step" data-step="cover"><i>▦</i>범위 현황</button>
  </nav>

  <main id="main">
    <section id="v-today" class="view"></section>
    <section id="v-read" class="view"></section>
    <section id="v-recall" class="view"></section>
    <section id="v-write" class="view"></section>
    <section id="v-compare" class="view"></section>
    <section id="v-review" class="view"></section>
    <section id="v-list" class="view"></section>
    <section id="v-due" class="view"></section>
    <section id="v-cover" class="view"></section>
    <section id="v-cards" class="view"></section>
    <section id="v-mock" class="view"></section>
    <section id="v-skel" class="view"></section>
    <section id="v-plan" class="view"></section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>

<script src="data.js?v=202611190813"></script>
<script src="scoring.js?v=202611190813"></script>
<script src="study.js?v=202611190813"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
